name: Publish to PyPI

on:
  release:
    types: [published]  # Trigger when a GitHub release is published

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install package and build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,scvelo]" build twine

    - name: Verify release tag matches package version
      run: |
        python - <<'PY'
        import os
        from importlib.metadata import version

        expected = f"v{version('velocity-kit')}"
        actual = os.environ["GITHUB_REF_NAME"]
        if actual != expected:
            raise SystemExit(f"Release tag {actual!r} does not match {expected!r}")
        PY

    - name: Run test suite
      run: python -m pytest -q
        
    - name: Build distribution packages
      run: python -m build
      
    - name: Check distribution packages
      run: twine check dist/*
      
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
        
    - name: Upload build artifacts to GitHub Release
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 30
