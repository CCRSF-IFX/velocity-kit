name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false  # Continue testing other versions even if one fails
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Verify dependency versions
      run: |
        echo "Python version:"
        python --version
        echo ""
        echo "Installed packages:"
        pip list | grep -E "(h5py|numpy|pandas|scipy|anndata|loompy)"
        echo ""
        # Verify h5py version based on Python version
        PYTHON_VERSION=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
        H5PY_VERSION=$(python -c "import h5py; print(h5py.__version__)")
        echo "Python $PYTHON_VERSION → h5py $H5PY_VERSION"
        if [[ "$PYTHON_VERSION" == "3.7" ]]; then
          # Python 3.7 should get h5py <3.8
          if [[ "${H5PY_VERSION%%.*}" -ge 3 ]] && [[ "${H5PY_VERSION#*.}" -ge 8 ]]; then
            echo "ERROR: Python 3.7 should have h5py <3.8.0, got $H5PY_VERSION"
            exit 1
          fi
          echo "✓ Python 3.7 has h5py <3.8.0"
        else
          # Python 3.8+ should get h5py >=3.10
          if [[ "${H5PY_VERSION%%.*}" -lt 3 ]] || [[ "${H5PY_VERSION#*.}" -lt 10 ]]; then
            echo "ERROR: Python 3.8+ should have h5py >=3.10.0, got $H5PY_VERSION"
            exit 1
          fi
          echo "✓ Python 3.8+ has h5py >=3.10.0"
        fi
        
    - name: Test package import
      run: |
        python -c "from velocitykit import load_10x_mtx, align_and_union, build_velocity_adata"
        python -c "from velocitykit.platforms import pipseq, tenx, common"
        
    - name: Test CLI help
      run: |
        python -m velocitykit.cli --help
        python -m velocitykit.cli prep-pipseq --help
        python -m velocitykit.cli prep-tenx --help
        
    # Uncomment when you add actual tests
    # - name: Run pytest
    #   run: pytest tests/
