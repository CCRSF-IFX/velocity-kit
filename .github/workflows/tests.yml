name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false  # Continue testing other versions even if one fails
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,scvelo]"
        
    - name: Verify dependency versions
      run: |
        echo "Python version:"
        python --version
        echo ""
        echo "Installed packages:"
        pip list | grep -E "(h5py|numpy|pandas|scipy|anndata|loompy)"
        echo ""
        python - <<'PY'
        import h5py
        from packaging.version import Version

        assert Version(h5py.__version__) >= Version("3.10.0"), h5py.__version__
        print(f"✓ h5py {h5py.__version__} >= 3.10.0")
        PY
        
    - name: Test package import
      run: |
        python -c "from velocitykit import load_10x_mtx, align_and_union, build_velocity_adata"
        python -c "from velocitykit.platforms import pipseq, tenx, common"
        python -c "from velocitykit import assemble, batch, scvelo_report"
        
    - name: Test CLI help
      run: |
        python -m velocitykit.cli --help
        python -m velocitykit.cli prep-pipseq --help
        python -m velocitykit.cli prep-tenx --help
        python -m velocitykit.cli prep-parsebio --help
        python -m velocitykit.cli assemble --help
        python -m velocitykit.cli correct-batch --help
        python -m velocitykit.cli run-scvelo --help

    - name: Run pytest
      run: python -m pytest -q
