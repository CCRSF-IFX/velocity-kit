[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "velocity-kit"
version = "0.1.1-test"
description = "A cross-platform toolkit for building RNA velocity-ready spliced/unspliced matrices"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Shaojun Xie", email = "xies4@nih.gov"}
]
keywords = ["bioinformatics", "single-cell", "RNA-velocity", "PIPseq", "10x-genomics", "parse-biosciences", "velocity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anndata>=0.8.0",
    "h5py>=3.0.0,<3.8.0; python_version < '3.8'",
    "h5py>=3.10.0; python_version >= '3.8'",
    "loompy>=3.0.6",
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
scvelo = ["scvelo>=0.2.4"]
dev = ["pytest>=7.0", "black", "flake8", "mypy"]

[project.urls]
Homepage = "https://github.com/CCRSF-IFX/velocity-kit"
Documentation = "https://github.com/CCRSF-IFX/velocity-kit#readme"
Repository = "https://github.com/CCRSF-IFX/velocity-kit"
"Bug Tracker" = "https://github.com/CCRSF-IFX/velocity-kit/issues"

[project.scripts]
velocity-kit = "velocitykit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
